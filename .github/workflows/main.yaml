
name: Python Cron Test

on:
  workflow_dispatch:
  schedule:
    # Temporary test schedule: every 5 minutes
    - cron: "*/5 * * * *"

permissions:
  contents: read

jobs:
  test-python:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Download repository code
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run main.py
        run: python -u main.py
